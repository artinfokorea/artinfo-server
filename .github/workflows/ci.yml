name: CI

# PR 과 main 푸시 모두에서 돈다 — 브랜치 보호를 켜면 이 체크 통과가 머지 조건이 된다
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck · Lint · Test (ongi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Dockerfile 과 동일한 설치 경로 — npm ci 는 피어 의존성 충돌(ERESOLVE)로 실패한다
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (ongi · salpyeo)
        run: npx eslint "src/ongi/**/*.ts" "src/salpyeo/**/*.ts"
      - name: Test (ongi · salpyeo)
        run: npx jest src/ongi src/salpyeo
